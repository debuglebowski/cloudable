name: "Set up Bun workspace"
description: >-
  Install the pinned Bun version (.bun-version) and run
  `bun install --frozen-lockfile --ignore-scripts` at the workspace root.
  Requires the repo to already be checked out (actions/checkout) — a local
  composite action can't check itself out.

runs:
  using: "composite"
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version

    - name: Cache Bun install cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      # --ignore-scripts: nothing in this workspace needs a native
      # postinstall build to function (verified: the only postinstall in
      # the whole tree, @biomejs/biome's, is a diagnostic no-op — the CLI
      # binary resolves via its optionalDependency package regardless).
      # Several devDependencies (e.g. @testcontainers/postgresql, via
      # ssh2/cpu-features) otherwise attempt a native rebuild with no
      # prebuilt binary on some runners, which fails the whole install.
      # See apps/control-plane/Dockerfile for the same failure.
      run: bun install --frozen-lockfile --ignore-scripts
