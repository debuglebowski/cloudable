name: Release agent & CLI

# docs/spec.md §25 "Packaging and distribution": agent and CLI are
# versioned binaries on GitHub releases (the control plane is a container
# image instead — see trivy-scan.yml / rebuild-base-image.yml).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.app }}
    strategy:
      matrix:
        app: [agent, cli]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        # --ignore-scripts: see ci.yml — nothing here needs a native
        # postinstall build to function.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build ${{ matrix.app }} (linux-x64)
        run: bun run --cwd apps/${{ matrix.app }} build

      - name: Build ${{ matrix.app }} (linux-arm64)
        run: bun run --cwd apps/${{ matrix.app }} build:arm64

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.app }}-binaries
          path: apps/${{ matrix.app }}/dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist

      - name: Flatten binaries into one release directory
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          ls -la release

      - name: Create release and upload binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
