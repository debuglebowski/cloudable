name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: typecheck, unit tests, integration tests, lint
    runs-on: ubuntu-latest
    # `apps/control-plane`'s `test:integration` connects directly to this
    # Postgres (see the comment on that script, and on the "Integration
    # tests" step below) — mirrors root `docker-compose.yml`'s service
    # exactly (same user/pass/db/port) so its default `DATABASE_URL`
    # fallback resolves without any extra config.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cloudable
          POSTGRES_PASSWORD: cloudable
          POSTGRES_DB: cloudable
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U cloudable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cloudable:cloudable@localhost:5442/cloudable
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun workspace
        uses: ./.github/actions/setup-bun

      - name: Typecheck (all workspaces)
        run: bun run --filter '*' typecheck

      # Ahead of the unit tests below: a few of `apps/control-plane`'s own
      # `test:unit` files (e.g. `EventBus.test.ts`, `config.test.ts`) also
      # exercise the `postgres` service above directly, so the schema needs
      # to exist before either step runs.
      - name: Apply database migrations
        run: bun run --cwd packages/schema db:migrate

      - name: Unit tests (all workspaces)
        run: bun run --filter '*' test:unit

      # `apps/control-plane`'s `test:integration` script runs everything that needs
      # a real Postgres or Docker: `reconcile-diff.integration.ts`, the `*.test.ts`
      # files that guard on `isDbReachable` (against the `postgres` service above),
      # and the `*.integration-check.ts` files (five of the compliance checks —
      # every one except `machines-reporting` and `vulnerabilities-remediated`, which have no
      # such file — plus the agent protocol), which each spin up their own throwaway Postgres via
      # testcontainers, independent of the service. Every other workspace's
      # `test:integration` is still a placeholder `exit 0`, wired in now so a real
      # script starts running in CI the moment it's written, not silently ignored.
      # docs/spec.md is explicit that some invariants (tenant-subject binding,
      # signature validation) are only ever caught by a negative-path integration
      # test.
      #
      # The script leaves out `ProvisioningService.docker.integration-check.ts`. It is
      # the only one that builds rather than just talks to Postgres: two
      # `bun build --compile` binaries and a `docker build` that runs `apt-get`, all
      # cold on every runner. It held steady at 32-44s for this whole step until
      # 2026-09-11, when it started taking 112-377s with no change on our side — a
      # package mirror stalling inside the build. It covers the local Docker
      # provisioning backend, which is dev/demo only, so paying that on every console
      # or control-plane commit buys nothing. `docker-provisioning-check.yml` runs it
      # on the paths that can break it. It also leaves out the Azure check, which
      # creates a real VM.
      - name: Integration tests (all workspaces)
        run: bun run --filter '*' test:integration

      - name: Lint (Biome)
        run: bun run lint
