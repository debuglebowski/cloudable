name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: typecheck, unit tests, lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        # --ignore-scripts: nothing in this workspace needs a native
        # postinstall build to function (verified: the only postinstall in
        # the whole tree, @biomejs/biome's, is a diagnostic no-op — the CLI
        # binary resolves via its optionalDependency package regardless).
        # See apps/control-plane/Dockerfile for the failure this avoids.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck (all workspaces)
        run: bun run --filter '*' typecheck

      - name: Unit tests (all workspaces)
        run: bun run --filter '*' test:unit

      - name: Lint (Biome)
        run: bun run lint
