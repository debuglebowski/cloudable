# Vulnerability scan for the control-plane container image.
#
# docs/spec.md §26 "Minimum internal compliance posture": Cloudable running
# in Cloudable's own tenant is privileged internal infrastructure, same
# tier as CI. This uses Trivy (aquasecurity/trivy-action), explicitly NOT
# Microsoft Defender for Containers — no Azure account exists for this
# internal tooling posture yet.
#
# The remediation SLA is written down (see SECURITY.md — Critical: 7 days,
# High: 30 days); scanning existing is not the control, findings being
# closed is. This workflow's job is only to produce the dated,
# severity-broken-down evidence that a finding exists and when it was
# first seen — closing it is tracked against SECURITY.md's SLA, not
# enforced by failing this job (Trivy runs here with exit-code 0).
#
# Every action below is pinned to a full commit SHA, not a mutable tag —
# aquasecurity/trivy-action itself was the target of a supply-chain
# compromise in March 2026 (tags 0.0.1-0.34.2 force-pushed to point at
# malicious commits; see GHSA-69fq-xp46-6x23). The SHA pinned here
# (v0.36.0) was published after remediation.
name: Trivy scan

on:
  push:
    branches: [main]
    paths: &image-paths
      - "apps/control-plane/**"
      - "packages/schema/**"
      - "packages/events/**"
      - "packages/contracts/**"
      - "bun.lock"
      - ".github/workflows/trivy-scan.yml"
  pull_request:
    paths: *image-paths
  workflow_call:
    inputs:
      image-ref:
        description: >-
          Pre-built, already-pushed image reference to scan (e.g. from
          GHCR) instead of building fresh from source. Used by
          rebuild-base-image.yml so the evidence produced here is for the
          exact image that was published, not a second, never-published
          build of the same Dockerfile.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      image-ref:
        description: "Optional pre-built image reference to scan instead of building from source."
        required: false
        type: string

permissions:
  contents: read
  security-events: write
  # Only exercised on the workflow_call/workflow_dispatch path with
  # image-ref set, to `docker pull` the pre-built image from GHCR.
  packages: read

jobs:
  trivy:
    name: Build + scan control-plane image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        if: inputs.image-ref == ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build control-plane image (from source)
        if: inputs.image-ref == ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/control-plane/Dockerfile
          push: false
          load: true
          tags: cloudable-control-plane:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to GHCR (to pull a pre-built image)
        if: inputs.image-ref != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pre-built image
        if: inputs.image-ref != ''
        run: docker pull "${{ inputs.image-ref }}"

      - name: Resolve image reference to scan
        id: image
        run: |
          if [ -n "${{ inputs.image-ref }}" ]; then
            echo "ref=${{ inputs.image-ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=cloudable-control-plane:scan" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan date
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          # Report only — see the note at the top of this file. Closing
          # findings against the SECURITY.md SLA is the control, not a
          # merge gate here.
          exit-code: "0"

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      # Same SARIF file, archived under a dated artifact name — satisfies
      # docs/spec.md's "workflow artifact or SARIF to code scanning"
      # (both, from a single scan) without paying for Trivy's vulnerability
      # DB pull and the image scan itself a second time.
      - name: Upload dated scan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-scan-${{ steps.date.outputs.date }}
          path: trivy-results.sarif
          retention-days: 90
