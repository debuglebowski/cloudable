name: Docker provisioning check

# `ProvisioningService.docker.integration-check.ts` split out of the main CI
# job. It is the only check in the tree that builds rather than just talks to
# Postgres: `bun build --compile` for the agent and tunnel-daemon binaries,
# then a `docker build` that runs `apt-get` — all cold on every runner, none of
# it cached between runs.
#
# It sat at 32-44s for the whole integration-check step until 2026-09-11, when
# it started taking 112-377s. Nothing on our side changed: same runner image,
# same Bun cache, no commit touching the agent, the tunnel-daemon or the
# Dockerfile. A package mirror inside the build started stalling, and one run
# hit the test's timeout and read as a code regression.
#
# The backend it covers is dev/demo only (see `apps/agent/docker/local-machine/
# Dockerfile`), so the main job should not pay minutes for it on a console or
# SSO commit. Here it runs only on the paths that can actually break it, and
# `ci.yml` sets `SKIP_DOCKER_PROVISIONING_CHECK` to leave it to this workflow.
on:
  push:
    branches: [main]
    paths: &docker-provisioning-paths
      - "apps/agent/**"
      - "apps/tunnel-daemon/**"
      - "apps/control-plane/src/services/ProvisioningService.docker.ts"
      - "apps/control-plane/src/services/ProvisioningService.docker.integration-check.ts"
      - ".github/workflows/docker-provisioning-check.yml"
  pull_request:
    paths: *docker-provisioning-paths

concurrency:
  group: docker-provisioning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-provisioning:
    name: local Docker provisioning lifecycle
    runs-on: ubuntu-latest
    # The test's own timeout is 600s and the build ahead of it is unbounded
    # from this repo's side. Cap the job so a stalled mirror fails in minutes
    # with a named step rather than sitting on a runner for six hours.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun workspace
        uses: ./.github/actions/setup-bun

      # The image build needs both binaries in `apps/agent/dist` first: the
      # Dockerfile `COPY`s them, and the tunnel-daemon is staged across from
      # its own package (the build context stays `apps/agent` so the repo
      # root's `.dockerignore`, which excludes `**/dist`, does not apply —
      # see `ensureImageBuilt`'s comment). Same work `ensureAgentBinaryBuilt`
      # and `ensureTunnelDaemonBinaryBuilt` would do inside the test, hoisted
      # so a failure here is named rather than an opaque test timeout.
      - name: Build agent and tunnel-daemon binaries
        run: |
          bun run --cwd apps/agent build
          bun run --cwd apps/tunnel-daemon build
          cp apps/tunnel-daemon/dist/cloudable-tunnel-daemon-linux-x64 apps/agent/dist/

      # Read the tag out of the source constant rather than repeating it. The
      # test only skips its own build when `docker image inspect` finds this
      # exact tag, so a rename of `IMAGE_NAME` would otherwise silently put us
      # back on the slow path with everything still green.
      - name: Resolve image tag from IMAGE_NAME
        id: image-tag
        run: |
          name=$(sed -n 's/^const IMAGE_NAME = "\(.*\)";$/\1/p' \
            apps/control-plane/src/services/ProvisioningService.docker.ts)
          if [ -z "$name" ]; then
            echo "could not read IMAGE_NAME from ProvisioningService.docker.ts" >&2
            exit 1
          fi
          echo "tag=${name}:22.04" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The point of this step. The Dockerfile's `apt-get` layer sits ahead of
      # the binary `COPY`s, so it stays cached even on an agent change — which
      # is what takes the package mirror off the critical path. It cost 7.7s on
      # a healthy connection and was unbounded on 2026-09-11 when a mirror
      # stalled. `load: true` puts the result in the local daemon, where the
      # test's `docker image inspect` finds it and skips building entirely.
      # Nothing is pushed; this image is dev/demo only and not a release
      # artifact.
      - name: Build local-machine image (cached)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/agent
          file: apps/agent/docker/local-machine/Dockerfile
          push: false
          load: true
          tags: ${{ steps.image-tag.outputs.tag }}
          # Explicit scope. `type=gha` defaults every build in the repo to
          # one shared scope, so this and `rebuild-base-image.yml` were both
          # writing `index-buildkit-1-f921bd05` and evicting each other's
          # index — each workflow missing whenever the other ran last, which
          # would have quietly defeated the caching this step exists for.
          # That one keeps the default; this one moves out of its way.
          cache-from: type=gha,scope=local-machine
          cache-to: type=gha,mode=max,scope=local-machine
          build-args: |
            BASE_IMAGE=ubuntu:22.04
            AGENT_BINARY=dist/cloudable-agent-linux-x64
            TUNNEL_DAEMON_BINARY=dist/cloudable-tunnel-daemon-linux-x64

      # No Postgres service and no secrets: this check drives the real Docker
      # daemon only. `create` mints its join token with `Effect.sync` and
      # `JOIN_TOKEN_SECRET` has a dev fallback, so nothing here reaches a
      # database. `SKIP_DOCKER_PROVISIONING_CHECK` is deliberately unset.
      - name: Docker provisioning lifecycle (control-plane)
        run: bun run --cwd apps/control-plane test:docker-provisioning
