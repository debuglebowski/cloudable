name: Rebuild control-plane image

# docs/spec.md §26 "Minimum internal compliance posture": pin the base
# image and rebuild on a schedule, not only when application code changes.
# `apps/control-plane/Dockerfile` pins an exact `oven/bun` tag — this is
# what re-pulls that tag's digest and rebuilds weekly, so a base-image CVE
# disclosed in a week with zero control-plane commits still gets picked
# up (and scanned — see trivy-scan.yml, invoked below against the exact
# image just pushed, not a second build of the same source).
#
# Actions are pinned to full commit SHAs rather than tags — see the note
# in trivy-scan.yml on why a mutable tag isn't good enough here.
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  push:
    branches: [main]
    paths:
      - "apps/control-plane/Dockerfile"
      - "apps/control-plane/**"
      - "packages/schema/**"
      - "packages/events/**"
      - "packages/contracts/**"
      - "bun.lock"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build + push control-plane image
    runs-on: ubuntu-latest
    outputs:
      # The exact, immutable reference the `scan` job below scans — never
      # `:main`, which a concurrent run could repoint mid-scan.
      scanned-ref: ${{ steps.image-name.outputs.image }}:run-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image-name
        run: |
          echo "image=ghcr.io/${{ github.repository }}/control-plane" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/control-plane/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # No `latest` tag: the run id makes "what is running right now"
          # unambiguous (docs/spec.md §26 — the same reasoning as pinning
          # deploy images by digest rather than by tag). The sha- tag plus
          # the OCI revision label carry the producing commit on the image
          # itself, for the same "what is running right now" traceability.
          tags: |
            ${{ steps.image-name.outputs.image }}:main
            ${{ steps.image-name.outputs.image }}:run-${{ github.run_id }}
            ${{ steps.image-name.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  scan:
    name: Trivy scan of the freshly pushed image
    needs: build-and-push
    uses: ./.github/workflows/trivy-scan.yml
    permissions:
      contents: read
      security-events: write
      packages: read # to `docker pull` the just-pushed image from GHCR
    with:
      # Scans the exact image just pushed above, not a second,
      # never-published build of the same Dockerfile.
      image-ref: ${{ needs.build-and-push.outputs.scanned-ref }}
